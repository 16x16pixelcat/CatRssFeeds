name: Build site on schedule or main branch update

on:
  push:
    branches:
      - main
  schedule:
    # Adjust refresh schedule here. By default, it runs once per day.
    # Syntax reference: https://github.com
    # Recommended tool: https://crontab.guru
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    
    # FIX: Grants the GITHUB_TOKEN write access to push the built site to GitHub Pages
    permissions:
      contents: write

    steps:
      # Upgraded from v2 to v4 for faster, reliable checkouts
      - uses: actions/checkout@v4

      # Upgraded from v2 to v4 and updated to Node 20 (Current LTS standard)
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install dependencies
        run: npm i
        
      - name: Build the feed
        run: npm run build
        
      - name: Deploy to GitHub Pages
        # Upgraded from v3 to v4 to ensure compatibility with modern permissions
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
